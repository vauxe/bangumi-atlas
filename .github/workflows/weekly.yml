# 每周烘焙与发布；门禁契约见 docs/EXPLORER_ARCHITECTURE.md。
# dump 周三 05:00 GMT+8 更新;本 workflow 周三 08:00 GMT+8 运行。
name: bake-and-deploy

on:
  schedule:
    - cron: "0 0 * * 3"
  workflow_dispatch:
    inputs:
      allow_cold_start:
        description: Allow an unmeasured layout for the first deployment only
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # keepalive:重置 60 天 cron 停用计时

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check pipeline types and lint
        run: |
          uv run python -m unittest discover -s tests
          uv run ruff check scripts/ tests/
          uv run mypy scripts/

      - name: Fetch dump (SHA256 verified)
        run: uv run python scripts/fetch_dump.py

      - name: Build graph database
        run: uv run python scripts/build_db.py

      - name: Verify database against dump
        run: uv run python scripts/verify_db.py

      - name: Restore coordinate cache (warm-start fallback)
        uses: actions/cache/restore@v4
        with:
          path: /tmp/cached_coords.parquet
          key: coords-${{ github.run_id }}
          restore-keys: coords-

      - name: Pull last week's coordinates (warm start)
        run: |
          # curl -f 失败时仍会留下空文件,必须清掉,否则 layout 读空 parquet 崩溃
          curl -fsSL --retry 3 --retry-delay 10 \
            -o /tmp/prev_coords.parquet \
            "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/coords.parquet" \
            || rm -f /tmp/prev_coords.parquet
          if [ -s /tmp/prev_coords.parquet ]; then
            echo "warm start: coordinates pulled from published site"
          else
            rm -f /tmp/prev_coords.parquet
            echo "published coordinates unavailable"
          fi

      - name: Layout (site coords -> cache fallback -> cold start)
        run: |
          if [ -s /tmp/prev_coords.parquet ]; then
            SRC=/tmp/prev_coords.parquet
          elif [ -s /tmp/cached_coords.parquet ]; then
            SRC=/tmp/cached_coords.parquet
            echo "warm start from actions/cache fallback"
          else
            SRC=""
            echo "cold start: no previous coordinates anywhere"
            if [ "${{ inputs.allow_cold_start }}" != "true" ]; then
              echo "cold-start publication requires an explicit manual override" >&2
              exit 1
            fi
          fi
          if [ -n "$SRC" ]; then
            uv run python scripts/layout.py --algo umap --warm-start "$SRC"
          else
            uv run python scripts/layout.py --algo umap
          fi
          cp data/layout/coords.parquet /tmp/cached_coords.parquet
          echo "layout report:" && cat data/layout/report.json
          # 跨周 p95 位移超过 3% 时不得覆盖稳定坐标。
          if [ "${{ inputs.allow_cold_start }}" = "true" ]; then
            uv run python scripts/check_layout_report.py \
              --allow-cold-start data/layout/report.json
          else
            uv run python scripts/check_layout_report.py data/layout/report.json
          fi

      - name: Save coordinate cache
        uses: actions/cache/save@v4
        with:
          path: /tmp/cached_coords.parquet
          key: coords-${{ github.run_id }}

      - name: Bake site data (row-level reconciliation inside)
        run: uv run python scripts/bake_site.py

      - name: Enforce size / file-count budgets
        run: |
          uv run python - <<'EOF'
          import json, sys
          m = json.load(open("site/data/manifest.json"))
          print(f"site: {m['total_bytes'] / 1e6:,.0f} MB, {m['n_files']:,} files")
          if m["total_bytes"] > 1_000_000_000:
              sys.exit("site exceeds GH Pages 1GB hard limit -> migrate to R2")
          if m["total_bytes"] > 900_000_000:
              print("::warning::site size within 10% of the 1GB Pages limit")
          if m["n_files"] > 20_000:
              print("::warning::file count exceeds CF Pages 20k limit; migration must target R2")
          EOF

      - name: Build client
        run: |
          cd web
          npm ci
          npm run test
          npm run check
          npm run build

      - name: Browser smoke gates
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_PATH"
          web/node_modules/.bin/http-server site -p 8300 -c-1 --silent &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:8300/ >/dev/null && break
            sleep 1
          done
          CHROME_PATH="$CHROME_PATH" node web/probe.mjs \
            http://127.0.0.1:8300/ /tmp/overview.png 12000
          CHROME_PATH="$CHROME_PATH" node web/probe_click.mjs \
            http://127.0.0.1:8300/ /tmp/click.png
          CHROME_PATH="$CHROME_PATH" node web/probe_leftcol.mjs \
            http://127.0.0.1:8300/ /tmp/leftcol.png

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Keepalive (reset the 60-day cron-disable timer)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            repos/${{ github.repository }}/actions/workflows/weekly.yml/enable

  deploy:
    needs: bake
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
