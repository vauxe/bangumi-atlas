# 每周烘焙与发布；门禁契约见 docs/EXPLORER_ARCHITECTURE.md。
# dump 周三 05:00 Asia/Singapore 更新;本 workflow 周三 08:00 Asia/Singapore 运行。
name: bake-and-deploy

on:
  schedule:
    - cron: "0 0 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      ATLAS_SITE_DIR: ${{ runner.temp }}/bangumi-atlas-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.27"
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check pipeline tests, lint, formatting, and types
        run: |
          uv run --frozen python -m unittest discover -s tests
          uv run --frozen ruff check scripts tests
          uv run --frozen ruff format --check scripts tests
          uv run --frozen mypy scripts

      - name: Prepare isolated staging site
        run: |
          mkdir -p "$ATLAS_SITE_DIR"
          cp site/index.html "$ATLAS_SITE_DIR/index.html"

      - name: Install client dependencies
        run: npm ci
        working-directory: web

      - name: Test, type-check, and build client
        run: |
          npm run test
          npm run check
          npm run build
        working-directory: web

      - name: Fetch dump (SHA256 verified)
        run: uv run --frozen python -m scripts.fetch_dump

      - name: Build graph database
        run: uv run --frozen python -m scripts.build_db

      - name: Verify database against dump
        run: uv run --frozen python -m scripts.verify_db

      - name: Layout current snapshot
        run: |
          uv run --frozen python -m scripts.layout
          echo "layout report:"
          cat data/layout/report.json

      - name: Bake site data (row-level reconciliation inside)
        run: uv run --frozen python -m scripts.bake_site --output "$ATLAS_SITE_DIR/data"

      - name: Verify SiteRelease against parquet (independent)
        run: uv run --frozen python -m scripts.verify_site --site "$ATLAS_SITE_DIR"

      - name: Smoke-test the complete SiteRelease over HTTP
        run: |
          npx http-server "$ATLAS_SITE_DIR" -a 127.0.0.1 -p 8391 -c-1 --silent &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in {1..30}; do
            if curl --fail --silent --output /dev/null \
              http://127.0.0.1:8391/data/manifest.json; then
              npm run smoke
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              wait "$server_pid"
              exit 1
            fi
            sleep 1
          done
          echo "::error::smoke server did not become ready in 30 seconds"
          exit 1
        working-directory: web

      # GitHub 门禁统计 staging site/ 下包括 manifest、客户端和全部
      # 数据在内的所有普通文件,不用 manifest total_bytes 代替。
      - name: Enforce size / file-count budgets on the full staging site
        run: |
          uv run --frozen python - <<'EOF'
          import os, pathlib, sys
          root = pathlib.Path(os.environ["ATLAS_SITE_DIR"])
          files = [p for p in root.rglob("*") if p.is_file()]
          total = sum(p.stat().st_size for p in files)
          print(f"staging site: {total:,} bytes, {len(files):,} files")
          if total > 1_000_000_000:
              sys.exit("site exceeds GH Pages 1GB hard limit -> migrate to R2")
          if total > 900_000_000:
              print("::warning::site size within 10% of the 1GB Pages limit")
          if len(files) > 20_000:
              print("::warning::file count exceeds CF Pages 20k limit; migration must target R2")
          EOF

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ env.ATLAS_SITE_DIR }}

  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keepalive (reset the 60-day cron-disable timer)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            repos/${{ github.repository }}/actions/workflows/weekly.yml/enable

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: bake
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
