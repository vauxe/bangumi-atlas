# 每周烘焙与发布；门禁契约见 docs/EXPLORER_ARCHITECTURE.md。
# dump 周三 05:00 GMT+8 更新;本 workflow 周三 08:00 GMT+8 运行。
name: bake-and-deploy

on:
  schedule:
    - cron: "0 0 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # keepalive:重置 60 天 cron 停用计时

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check pipeline types and lint
        run: |
          uv run python -m unittest discover -s tests
          uv run ruff check scripts/ tests/
          uv run mypy scripts/

      - name: Fetch dump (SHA256 verified)
        run: uv run python scripts/fetch_dump.py

      - name: Build graph database
        run: uv run python scripts/build_db.py

      - name: Verify database against dump
        run: uv run python scripts/verify_db.py

      - name: Layout current snapshot
        run: |
          uv run python scripts/layout.py --algo umap
          echo "layout report:"
          cat data/layout/report.json

      - name: Bake site data (row-level reconciliation inside)
        run: uv run python scripts/bake_site.py

      - name: Verify SiteRelease against parquet (independent)
        run: uv run python scripts/verify_site.py

      - name: Build client
        run: |
          cd web
          npm ci
          npm run test
          npm run check
          npm run build

      # GitHub 门禁统计 staging site/ 下包括 manifest、客户端和全部
      # 数据在内的所有普通文件,不用 manifest total_bytes 代替。
      - name: Enforce size / file-count budgets on the full staging site
        run: |
          uv run python - <<'EOF'
          import pathlib, sys
          files = [p for p in pathlib.Path("site").rglob("*") if p.is_file()]
          total = sum(p.stat().st_size for p in files)
          print(f"staging site/: {total:,} bytes, {len(files):,} files")
          if total > 1_000_000_000:
              sys.exit("site exceeds GH Pages 1GB hard limit -> migrate to R2")
          if total > 900_000_000:
              print("::warning::site size within 10% of the 1GB Pages limit")
          if len(files) > 20_000:
              print("::warning::file count exceeds CF Pages 20k limit; migration must target R2")
          EOF

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

      - name: Keepalive (reset the 60-day cron-disable timer)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            repos/${{ github.repository }}/actions/workflows/weekly.yml/enable

  deploy:
    needs: bake
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
