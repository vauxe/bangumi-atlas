# 每周烘焙与发布；上游 dump 周三 05:00 Asia/Singapore 更新。
name: bake-and-deploy

on:
  schedule:
    - cron: "15 8 * * 3"
      timezone: Asia/Singapore
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.27"
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check pipeline tests, lint, formatting, and types
        run: |
          uv run --frozen python -m unittest discover -s tests
          uv run --frozen ruff check scripts tests
          uv run --frozen ruff format --check scripts tests
          uv run --frozen mypy scripts

      - name: Prepare isolated staging site
        run: |
          staging_dir="$RUNNER_TEMP/bangumi-atlas-site"
          printf 'ATLAS_SITE_DIR=%s\n' "$staging_dir" >> "$GITHUB_ENV"
          mkdir -p "$staging_dir"
          cp site/index.html "$staging_dir/index.html"

      - name: Install client dependencies
        run: npm ci
        working-directory: web

      - name: Test, type-check, and build client
        run: |
          npm run test
          npm run check
          npm run build
        working-directory: web

      - name: Fetch dump (SHA256 verified)
        run: uv run --frozen python -m scripts.fetch_dump

      - name: Build graph database
        run: uv run --frozen python -m scripts.build_db

      - name: Verify database against dump
        run: uv run --frozen python -m scripts.verify_db

      - name: Layout current snapshot
        run: |
          uv run --frozen python -m scripts.layout
          echo "layout report:"
          cat data/layout/report.json

      - name: Bake site data (row-level reconciliation inside)
        run: uv run --frozen python -m scripts.bake_site --output "$ATLAS_SITE_DIR/data"

      - name: Verify SiteRelease against parquet (independent)
        run: uv run --frozen python -m scripts.verify_site --site "$ATLAS_SITE_DIR"

      - name: Smoke-test the complete SiteRelease over HTTP
        run: |
          npx http-server "$ATLAS_SITE_DIR" -a 127.0.0.1 -p 8391 -c-1 --silent &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in {1..30}; do
            if curl --fail --silent --output /dev/null \
              http://127.0.0.1:8391/data/manifest.json; then
              npm run smoke
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              wait "$server_pid"
              exit 1
            fi
            sleep 1
          done
          echo "::error::smoke server did not become ready in 30 seconds"
          exit 1
        working-directory: web

      - name: Warn when the staging site nears the Pages limit
        run: |
          uv run --frozen python - <<'EOF'
          import os, pathlib
          root = pathlib.Path(os.environ["ATLAS_SITE_DIR"])
          files = [p for p in root.rglob("*") if p.is_file()]
          total = sum(p.stat().st_size for p in files)
          print(f"staging site: {total:,} bytes, {len(files):,} files")
          if total > 900_000_000:
              print("::warning::site size within 10% of the 1GB Pages limit")
          EOF

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/bangumi-atlas-site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: bake
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
