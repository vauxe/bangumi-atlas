[project]
name = "bangumi-atlas"
version = "0.1.0"
description = "bangumi/Archive dump -> LadybugDB graph database"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "ladybug>=0.19",
    "pyarrow>=18",
    "orjson>=3.10",
    "pyyaml>=6",
    "pandas>=2.2",
    "igraph>=1.0.0",
    "umap-learn>=0.5.12",
    "pacmap>=0.9.1",
    "scipy>=1.18.0",
    "opencc-python-reimplemented>=0.1.7",
]

[dependency-groups]
dev = ["ruff>=0.9", "mypy>=1.14", "types-pyyaml>=6"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "BLE"]

[tool.mypy]
files = ["scripts"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["ladybug.*", "pyarrow.*", "igraph.*", "umap.*", "pacmap.*", "opencc.*"]
ignore_missing_imports = true
