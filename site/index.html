<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bangumi 星图</title>
<meta name="description" content="探索 Bangumi 作品、人物与角色之间的关系。">
<link rel="preload" href="app.js" as="script">
<link rel="icon" href="data:,">
<meta property="og:title" content="Bangumi 星图">
<meta property="og:description"
      content="作品、人物与角色的 3D 关系宇宙">
<style>
:root {
  --surface: #0f1a1c; --panel: #14262b;
  --ink: #eafcfa; --ink-2: #8fb8b5; --line: #24444a;
  --miku: #39c5bb; --pink: #f25ba6;
  --c-subject: #3d8ede; --c-person: #e56a40; --c-character: #27ab7c;
  --page-inset: 14px; --query-max-width: 680px;
  --floating-action-size: 44px; --floating-action-gap: 8px;
  --drawer-max-width: 500px;
  --drawer-width: min(100dvw, clamp(360px, 38dvw, var(--drawer-max-width)));
  --occupied-right: 0px;
  --query-shell-max-width: calc(
    var(--query-max-width) + var(--floating-action-gap) + var(--floating-action-size)
  );
  --query-shell-min-width: calc(
    var(--floating-action-gap) + var(--floating-action-size)
  );
}
body:has(#drawer.open) { --occupied-right: var(--drawer-width); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--surface);
  color: var(--ink);
  font: 14px/1.6 ui-rounded, "Yuanti SC", "YouYuan", "幼圆",
    -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
#map { position: fixed; inset: 0; }
#hud { position: fixed; bottom: 12px; right: 12px; color: var(--ink-2);
  font-family: monospace; z-index: 5; pointer-events: none; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0;
  margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0);
  white-space: nowrap; border: 0; }
button:focus-visible, input:focus-visible, a:focus-visible {
  outline: 2px solid var(--pink);
  outline-offset: 2px; }
#query-dock { position: fixed; top: var(--page-inset); left: var(--page-inset);
  display: grid;
  grid-template-columns: minmax(0, var(--query-max-width)) var(--floating-action-size);
  gap: var(--floating-action-gap);
  width: min(
    var(--query-shell-max-width),
    max(
      var(--query-shell-min-width),
      calc(100dvw - var(--occupied-right) - var(--page-inset) - var(--page-inset))
    )
  );
  z-index: 6; pointer-events: none; }
#query-dock > * { pointer-events: auto; }
#query-dock > :not(#dice) { min-width: 0; grid-column: 1; grid-row: 1; }
#dice { grid-column: 2; grid-row: 1; width: var(--floating-action-size);
  height: var(--floating-action-size); margin-top: 2px; border: 1px solid var(--line);
  background: rgba(20, 38, 43, .94); font-size: 19px;
  color: var(--ink); cursor: pointer; border-radius: 50%;
  box-shadow: 0 4px 18px rgba(0, 0, 0, .28);
  transition: background .15s, border-color .15s, transform .15s; }
#dice:hover { border-color: var(--miku); background: rgba(57, 197, 187, .14);
  transform: translateY(-1px) rotate(-8deg); }
#dice:active { transform: scale(.94); }
#drawer { position: fixed; top: 0; right: 0; bottom: 0;
  width: var(--drawer-width);
  background: var(--panel); z-index: 7; padding: 20px;
  overflow-y: auto; transform: translateX(105%); transition: transform .25s;
  border-left: 2px solid var(--pink);
  box-shadow: -8px 0 24px rgba(242, 91, 166, .12); }
#drawer.open { transform: none; }
#drawer-reopen { position: fixed; top: 50%; right: 0; z-index: 6;
  min-width: 56px; min-height: 44px; padding: 0 12px;
  transform: translateY(-50%); border: 1px solid var(--pink); border-right: 0;
  border-radius: 8px 0 0 8px; background: var(--panel); color: var(--ink);
  box-shadow: -4px 0 16px rgba(242, 91, 166, .14);
  cursor: pointer; font: inherit; font-size: 12px; font-weight: 650; }
#drawer-reopen:hover { color: var(--miku); background: var(--line); }
#drawer-reopen:focus-visible { outline: 2px solid var(--miku); outline-offset: 2px; }
#drawer-reopen[hidden] { display: none; }
#drawer h2 { margin: 2px 112px 2px 0; font-size: 24px; line-height: 1.25;
  letter-spacing: -.02em; }
#drawer h3 { margin: 0 0 10px; font-size: 13px; font-weight: 650;
  letter-spacing: .04em; color: var(--ink); }
.dossier-header { min-height: 136px; padding-top: 2px; }
.dossier-header::after { content: ""; display: block; clear: both; }
.eyebrow { color: var(--miku); font-size: 11px; letter-spacing: .08em;
  text-transform: uppercase; margin: 3px 112px 5px 0; }
.chip-media { position: relative; width: 20px; height: 20px; flex: none;
  display: inline-grid; place-items: center; border-radius: 50%;
  overflow: hidden; }
.chip-mark { width: 9px; height: 9px; border-radius: 50%; flex: none;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .35); }
.chip-mark.type-1 { background: var(--c-subject); }
.chip-mark.type-2 { background: var(--c-person); }
.chip-mark.type-3 { background: var(--c-character); }
.chip-av { position: absolute; inset: 0; width: 100%; height: 100%;
  border-radius: 50%; object-fit: cover; }
#drawer .chip { display: inline-flex; align-items: center; gap: 6px; }
#drawer .cover { float: right; width: 96px; height: 128px;
  object-fit: cover; border-radius: 8px; margin: 8px 0 10px 16px;
  clear: right; background: var(--line); }
#drawer .subtitle { color: var(--ink-2); margin: 4px 112px 8px 0;
  font-size: 13px; }
.drawer-actions { position: sticky; top: 0; float: right; z-index: 2;
  display: flex; gap: 4px; }
.drawer-action { display: grid; place-items: center; border: 0;
  width: 32px; height: 32px; border-radius: 50%; text-decoration: none;
  background: rgba(20, 38, 43, .85); color: var(--ink-2);
  cursor: pointer; }
.drawer-action:hover { color: var(--ink); background: var(--line); }
.drawer-external svg { width: 17px; height: 17px; fill: none;
  stroke: currentColor; stroke-width: 2; stroke-linecap: round;
  stroke-linejoin: round; }
#drawer-close { font-family: inherit; font-size: 20px; line-height: 1; }
.dossier-tabs { position: sticky; top: -20px; z-index: 1; clear: both;
  display: flex; gap: 2px; margin: 4px -20px 0; padding: 12px 20px 0;
  background: rgba(20, 38, 43, .97); border-bottom: 1px solid var(--line); }
.dossier-tab { min-width: 0; padding: 8px 12px 9px; border: 0;
  border-bottom: 2px solid transparent; background: none; color: var(--ink-2);
  cursor: pointer; font: inherit; font-size: 12px; white-space: nowrap; }
.dossier-tab:hover { color: var(--ink); }
.dossier-tab[aria-selected="true"] { color: var(--ink);
  border-bottom-color: var(--pink); }
.dossier-panel { padding: 18px 0 28px; }
.primary-action, .secondary-action { min-height: 38px; border-radius: 8px;
  padding: 7px 12px; cursor: pointer; font: inherit; font-size: 12px;
  appearance: none; -webkit-appearance: none; }
.primary-action { border: 1px solid var(--miku); background: var(--miku);
  color: #06211f; font-weight: 650; }
.primary-action:hover { background: #5fd6cc; }
.secondary-action { border: 1px solid var(--line); background: transparent;
  color: var(--ink-2); }
.secondary-action:hover { border-color: var(--ink-2); color: var(--ink); }
.full-width { width: 100%; margin-top: 14px; }
.dossier-section { padding: 16px 0; border-top: 1px solid var(--line); }
.dossier-section:first-child { border-top: 0; padding-top: 0; }
.dossier-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  margin: 0; }
.dossier-facts > div { min-width: 0; padding: 9px 10px;
  background: rgba(15, 26, 28, .52); border-radius: 6px; }
.dossier-facts > .fact-wide { grid-column: 1 / -1; }
.dossier-facts dt { color: var(--ink-2); font-size: 11px; }
.dossier-facts dd { margin: 1px 0 0; overflow-wrap: anywhere; }
.distribution-row { display: grid; grid-template-columns: 52px 1fr 64px;
  align-items: center; gap: 9px; min-height: 25px; font-size: 12px; }
.distribution-row > span:last-child { color: var(--ink-2); text-align: right;
  font-variant-numeric: tabular-nums; }
.distribution-row meter { width: 100%; height: 8px; border: 0;
  background: var(--line); }
.distribution-row meter::-webkit-meter-bar { height: 8px; border: 0;
  border-radius: 4px; background: var(--line); }
.distribution-row meter::-webkit-meter-optimum-value { border-radius: 4px;
  background: var(--miku); }
.distribution-row meter::-moz-meter-bar { border-radius: 4px;
  background: var(--miku); }
.tag-cloud { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-pill { display: inline-flex; align-items: baseline; gap: 5px;
  max-width: 100%; padding: 3px 8px; border: 1px solid var(--line);
  border-radius: 12px; color: var(--ink-2); font-size: 12px; }
.tag-pill small { color: var(--miku); font-size: 10px;
  font-variant-numeric: tabular-nums; }
.more-data { margin-top: 10px; }
.more-data summary, .source-disclosure summary { color: var(--miku);
  cursor: pointer; font-size: 12px; }
.more-data[open] summary { margin-bottom: 10px; }
.text-action { display: block; padding: 6px 0 0; border: 0;
  background: none; color: var(--miku); cursor: pointer; font: inherit;
  font-size: 12px; }
.relations-intro { color: var(--ink-2); font-size: 12px; margin-bottom: 12px; }
.relation-section { border-top: 1px solid var(--line); }
.relation-section:last-of-type { border-bottom: 1px solid var(--line); }
.relation-section > summary { display: flex; align-items: center; gap: 8px;
  min-height: 44px; cursor: pointer; font-weight: 650; list-style: none; }
.relation-section > summary::-webkit-details-marker { display: none; }
.relation-section > summary::after { content: "＋"; margin-left: auto;
  color: var(--ink-2); }
.relation-section[open] > summary::after { content: "－"; }
.relation-section > summary small { color: var(--ink-2); font-weight: 400; }
.relation-section .group { margin: 2px 0 12px; }
.empty-state { display: grid; gap: 4px; place-items: start; padding: 28px 0;
  color: var(--ink-2); }
.empty-state strong { color: var(--ink); }
.episode-list { display: grid; gap: 6px; }
.episode-list .ep { padding: 9px 10px; border: 1px solid var(--line);
  border-radius: 6px; }
.episode-list .ep:focus { outline: 2px solid var(--pink); outline-offset: 2px;
  background: rgba(242, 91, 166, .08); }
.reference-heading { color: var(--ink-2); font-size: 11px;
  margin-bottom: 8px; }
.reference-grid { margin: 0; }
.reference-grid > div { display: grid; grid-template-columns: minmax(90px, 32%) 1fr;
  gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.reference-grid dt { color: var(--ink-2); font-size: 12px; }
.reference-grid dd { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
.reference-values { display: grid; gap: 5px; margin: 0; padding: 0;
  list-style: none; }
.reference-values li { display: grid; grid-template-columns: minmax(76px, 30%) 1fr;
  gap: 8px; min-width: 0; }
.reference-item-label { color: var(--ink-2); font-size: 12px; }
.source-disclosure { margin-top: 18px; padding-top: 14px;
  border-top: 1px solid var(--line); }
.badge { background: var(--line); border-radius: 8px; padding: 2px 8px;
  font-size: 12px; margin-right: 6px; }
.tag { color: var(--ink-2); font-size: 12px; margin-right: 8px; }
.stats { color: var(--ink-2); margin: 8px 112px 8px 0; font-size: 12px; }
.sum { margin: 10px 0; max-height: 4.8em; overflow: hidden;
  position: relative; white-space: pre-line; }
.sum.expanded { max-height: none; }
.sum-toggle { display: block; border: 0; background: none;
  color: var(--miku); cursor: pointer; padding: 2px 0; }
.group { margin-top: 14px; }
.group-label { color: var(--ink-2); font-size: 12px; margin-bottom: 6px; }
.chip { background: var(--miku); color: #06211f; border: 0;
  border-radius: 16px; padding: 4px 10px; margin: 0 6px 6px 0;
  cursor: pointer; font-size: 13px; font-family: inherit;
  /* 必须显式关掉原生外观:macOS 按钮的原生白底会盖过作者背景 */
  appearance: none; -webkit-appearance: none; }
.chip:hover { background: #5fd6cc; }
.chip.on { background: var(--pink); color: #3a0b22; }
.note, .ep-date { color: var(--ink-2); font-size: 12px; }
button.more { background: none; border: 0; padding: 4px 6px;
  color: var(--miku); font-size: 12px; font-family: inherit;
  cursor: pointer; appearance: none; -webkit-appearance: none; }
button.more:hover { text-decoration: underline; }
.ep { font-size: 13px; padding: 2px 0; }
.ep-desc { border: 0; background: none; color: var(--miku);
  cursor: pointer; font-size: 12px; font-family: inherit;
  padding: 0 4px; appearance: none; -webkit-appearance: none; }
.ep-desc:hover { text-decoration: underline; }
.ep-body { color: var(--ink-2); font-size: 12px; margin: 4px 0 6px 12px;
  white-space: pre-line; }
/* infobox 是未解析且不可信的 Wiki 源码,只按纯文本展示 */
pre.infobox { white-space: pre-wrap; word-break: break-all;
  font-size: 12px; color: var(--ink-2); background: rgba(0,0,0,.25);
  border-radius: 6px; padding: 8px; max-height: 40vh; overflow: auto; }
.loading { color: var(--ink-2); }

#legend { position: fixed; left: var(--page-inset); bottom: 12px; z-index: 5;
  max-width: max(
    0px,
    calc(100dvw - var(--occupied-right) - var(--page-inset) - var(--page-inset))
  ); padding: 5px 9px;
  border: 1px solid rgba(36, 68, 74, .75); border-radius: 16px;
  background: rgba(15, 26, 28, .72); color: var(--ink-2);
  box-shadow: 0 4px 18px rgba(0, 0, 0, .18);
  backdrop-filter: blur(8px); font-size: 12px; pointer-events: none; }
#legend i { display: inline-block; width: 10px; height: 10px;
  border-radius: 50%; margin: 0 4px 0 10px; vertical-align: -1px; }
#legend i:first-child { margin-left: 0; }
#tooltip { position: fixed; display: none; z-index: 8;
  background: rgba(20,38,43,.95); border: 1px solid var(--line);
  padding: 4px 10px; border-radius: 8px; pointer-events: none;
  font-size: 13px; }
#tooltip .tt { color: var(--ink-2); font-size: 11px; }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  #dice:hover { transform: none; }
}
</style>
<link rel="stylesheet" href="query.css">
</head>
<body>
<h1 class="sr-only">Bangumi 星图</h1>
<div id="map"></div>

<div id="query-dock">
  <button id="dice" type="button" title="随机传送"
          aria-label="随机传送">🎲</button>
</div>
<aside id="drawer" aria-label="节点详情" aria-hidden="true" tabindex="-1" inert></aside>
<button id="drawer-reopen" type="button" aria-controls="drawer"
        aria-label="重新打开当前节点详情" hidden>‹ 详情</button>

<div id="legend">
  <i style="background:var(--c-subject)"></i>作品
  <i style="background:var(--c-person)"></i>人物
  <i style="background:var(--c-character)"></i>角色
  <span id="hint" style="margin-left:10px"></span>
</div>
<div id="tooltip" role="tooltip"></div>
<div id="hud" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
