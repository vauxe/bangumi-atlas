<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bangumi 星图</title>
<link rel="preload" href="app.js" as="script">
<link rel="icon" href="data:,">
<meta property="og:title" content="Bangumi 星图">
<meta property="og:description"
      content="99 万个作品、人物与角色的 3D 关系宇宙">
<style>
:root {
  /* 初音未来配色:葱色 #39C5BB 主调 + 黑青夜空底 + 品红粉点缀,
     抽屉为粉色调面板。数据三色(天蓝/珊瑚/薄荷)是编码色,
     在本底色上重新通过 CVD ΔE≥8 与对比度校验,不随主题漂移 */
  --surface: #0f1a1c; --panel: #14262b;
  --ink: #eafcfa; --ink-2: #8fb8b5; --line: #24444a;
  --miku: #39c5bb; --pink: #f25ba6;
  --c-subject: #3d8ede; --c-person: #e56a40; --c-character: #27ab7c;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--surface);
  color: var(--ink);
  font: 14px/1.6 ui-rounded, "Yuanti SC", "YouYuan", "幼圆",
    -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
#map { position: fixed; inset: 0; }
#hud { position: fixed; bottom: 12px; right: 12px; color: var(--ink-2);
  font-family: monospace; z-index: 5; pointer-events: none; }

#searchwrap { position: relative; }
#search { width: 100%; padding: 12px 16px; font-size: 16px;
  background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: 20px; outline: none; }
#search:focus { border-color: var(--pink);
  box-shadow: 0 0 0 3px rgba(242, 91, 166, .22); }
#hits { position: absolute; top: 100%; left: 0; right: 0; z-index: 9;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 0 0 16px 16px; text-align: left; max-height: 320px;
  overflow: auto; }
#hits:empty { display: none; } /* 空下拉不渲染,消除搜索框下的线 */
#hits .hit { padding: 8px 16px; cursor: pointer; }
#hits .hit.active, #hits .hit:hover { background: var(--line); }

#searchwrap-dock { position: fixed; top: 14px; left: 14px;
  width: 300px; z-index: 6; }

/* 抽屉:深青面板,粉色只作边缘高亮(描边 + 边缘光晕),内部无粉 */
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 420px;
  max-width: 92vw; background: var(--panel); z-index: 7; padding: 20px;
  overflow-y: auto; transform: translateX(105%); transition: transform .25s;
  border-left: 2px solid var(--pink);
  box-shadow: -8px 0 24px rgba(242, 91, 166, .12); }
#drawer.open { transform: none; }
#drawer h2 { margin: 4px 24px 2px 0; font-size: 20px; }
#drawer .cover { float: right; width: 96px; border-radius: 12px;
  margin: 24px 0 10px 12px; }
.chip-av { width: 20px; height: 20px; border-radius: 50%;
  object-fit: cover; flex: none; }
#drawer .chips .chip { display: inline-flex; align-items: center;
  gap: 6px; }
#drawer .subtitle { color: var(--ink-2); margin-bottom: 8px; }
#drawer-close { position: absolute; top: 10px; right: 12px; border: 0;
  background: none; color: var(--ink-2); font-size: 22px; cursor: pointer; }
.badge { background: var(--line); border-radius: 8px; padding: 2px 8px;
  font-size: 12px; margin-right: 6px; }
.tag { color: var(--ink-2); font-size: 12px; margin-right: 8px; }
.stats { color: var(--ink-2); margin: 8px 0; font-size: 13px; }
.sum { margin: 10px 0; max-height: 4.8em; overflow: hidden;
  position: relative; white-space: pre-line; }
.sum.expanded { max-height: none; }
.sum-toggle { display: block; border: 0; background: none;
  color: var(--miku); cursor: pointer; padding: 2px 0; }
.group { margin-top: 14px; }
.group-label { color: var(--ink-2); font-size: 12px; margin-bottom: 6px; }
/* 交互元素:平时初音绿,高亮(激活/选中)发饰粉 */
.chip { background: var(--miku); color: #06211f; border: 0;
  border-radius: 16px; padding: 4px 10px; margin: 0 6px 6px 0;
  cursor: pointer; font-size: 13px; font-family: inherit;
  /* 必须显式关掉原生外观:macOS 按钮的原生白底会盖过作者背景 */
  appearance: none; -webkit-appearance: none; }
.chip:hover { background: #5fd6cc; }
.chip.on { background: var(--pink); color: #3a0b22; }
.note, .ep-date { color: var(--ink-2); font-size: 12px; }
/* "还有 N 个"可点:静默态初音绿,与交互元素配色语义一致 */
button.more { background: none; border: 0; padding: 4px 6px;
  color: var(--miku); font-size: 12px; font-family: inherit;
  cursor: pointer; appearance: none; -webkit-appearance: none; }
button.more:hover { text-decoration: underline; }
.ep { font-size: 13px; padding: 2px 0; }
.ext { display: inline-block; margin-top: 16px; color: var(--miku); }
.loading { color: var(--ink-2); }

#toolbar { position: fixed; right: 14px; bottom: 40px; z-index: 6;
  display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
#toolbar .row { background: rgba(20,38,43,.88); border: 1px solid var(--line);
  border-radius: 16px; padding: 6px 8px; backdrop-filter: blur(4px);
  display: flex; align-items: center; gap: 6px; }
#toolbar .chip { margin: 0; min-height: 44px; min-width: 44px;
  display: inline-flex; align-items: center; justify-content: center;
  line-height: 1; }
#toolbar label { display: inline-flex; align-items: center; gap: 4px;
  min-height: 44px; }
#toolbar button { cursor: pointer; }
#year-row { min-height: 44px; }
#year-label { font-size: 12px; color: var(--ink-2); min-width: 76px;
  text-align: right; }
#year-slider { position: relative; width: 170px; height: 24px; }
#year-slider::before { content: ""; position: absolute; left: 0; right: 0;
  top: 11px; height: 3px; background: var(--line); border-radius: 2px; }
#year-slider input[type="range"] { position: absolute; inset: 0;
  width: 100%; margin: 0; background: none; pointer-events: none;
  -webkit-appearance: none; appearance: none; }
#year-slider input[type="range"]::-webkit-slider-thumb {
  pointer-events: auto; -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--pink); border: 0; cursor: pointer; }
#year-slider input[type="range"]::-moz-range-thumb {
  pointer-events: auto; width: 14px; height: 14px; border-radius: 50%;
  background: var(--pink); border: 0; cursor: pointer; }
#year-slider input[type="range"]::-moz-range-track { background: none; }
.expand { display: block; margin-top: 8px; }
#legend { position: fixed; left: 14px; bottom: 12px; z-index: 5;
  color: var(--ink-2); font-size: 12px; pointer-events: none; }
#legend i { display: inline-block; width: 10px; height: 10px;
  border-radius: 50%; margin: 0 4px 0 10px; vertical-align: -1px; }
#tooltip { position: fixed; display: none; z-index: 8;
  background: rgba(20,38,43,.95); border: 1px solid var(--line);
  padding: 4px 10px; border-radius: 8px; pointer-events: none;
  font-size: 13px; }
#tooltip .tt { color: var(--ink-2); font-size: 11px; }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div id="map"></div>

<div id="searchwrap-dock">
  <div id="searchwrap">
    <input id="search" placeholder="搜索作品 / 人物 / 角色 ✨"
           autocomplete="off">
    <div id="hits"></div>
  </div>
</div>

<div id="drawer"></div>

<div id="toolbar">
  <div class="row" id="media-chips"></div>
  <div class="row" id="year-row">
    <span id="year-label">全部年代</span>
    <div id="year-slider">
      <input id="year-min" type="range" step="1">
      <input id="year-max" type="range" step="1">
    </div>
  </div>
  <div class="row">
    <button id="layer-toggle" class="chip">社区着色</button>
    <button id="top-toggle" class="chip" title="俯视(正交)">俯视</button>
    <button id="dice" class="chip" title="随机传送">🎲</button>
  </div>
</div>

<div id="legend">
  <i style="background:var(--c-subject)"></i>作品
  <i style="background:var(--c-person)"></i>人物
  <i style="background:var(--c-character)"></i>角色
  <span style="margin-left:10px">右键拖 旋转 · `2` 俯视 · `H` 复位 · `/` 搜索</span>
</div>
<div id="tooltip"></div>
<div id="hud"></div>

<script src="app.js"></script>
</body>
</html>
