<!doctype html>
<!-- 帧率 spike(EXPLORER.md §9 第 1 步)。一次性实验代码,不代表应用工程标准。 -->
<html lang="zh">
<head>
<meta charset="utf-8">
<title>bangumi-atlas 帧率 spike</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e1a; }
  #hud { position: fixed; top: 12px; left: 12px; color: #c3c2b7;
         font: 14px/1.6 monospace; white-space: pre; z-index: 9; }
</style>
<script src="https://unpkg.com/deck.gl@9.0.36/dist.min.js"></script>
</head>
<body>
<div id="hud">初始化…</div>
<script>
"use strict";
const N = 985_328;            // 入图节点数(设计文档 §2)
const E = 500_000;            // 骨架边数
const CLUSTERS = 60;
const hud = document.getElementById("hud");
const log = (t) => { hud.textContent = t; };

// ---- 合成数据:高斯聚簇点云 + 簇内为主的边 ----
function makeData() {
  const centers = [];
  for (let c = 0; c < CLUSTERS; c++) {
    centers.push([(Math.random() - 0.5) * 700, (Math.random() - 0.5) * 700,
                  (Math.random() - 0.5) * 700]);
  }
  const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) * 2;
  const pos = new Float32Array(N * 3);
  const color = new Uint8Array(N * 4);
  const size = new Float32Array(N);
  const palette = [[57, 135, 229], [217, 89, 38], [25, 158, 112]];
  const clusterOf = new Uint16Array(N);
  for (let i = 0; i < N; i++) {
    const c = (Math.random() * CLUSTERS) | 0;
    clusterOf[i] = c;
    const spread = 20 + (c % 7) * 8;
    pos[i * 3] = centers[c][0] + gauss() * spread;
    pos[i * 3 + 1] = centers[c][1] + gauss() * spread;
    pos[i * 3 + 2] = centers[c][2] + gauss() * spread;
    const p = palette[i % 3];
    color[i * 4] = p[0]; color[i * 4 + 1] = p[1]; color[i * 4 + 2] = p[2];
    color[i * 4 + 3] = 200;
    size[i] = 1 + Math.pow(Math.random(), 8) * 5;   // Zipf 式长尾
  }
  // 边:80% 簇内(空间局部),20% 跨簇长边
  const src = new Float32Array(E * 3), dst = new Float32Array(E * 3);
  const byCluster = Array.from({ length: CLUSTERS }, () => []);
  for (let i = 0; i < N; i += 7) byCluster[clusterOf[i]].push(i); // 采样索引
  for (let e = 0; e < E; e++) {
    let a, b;
    if (Math.random() < 0.8) {
      const arr = byCluster[(Math.random() * CLUSTERS) | 0];
      a = arr[(Math.random() * arr.length) | 0];
      b = arr[(Math.random() * arr.length) | 0];
    } else {
      a = (Math.random() * N) | 0; b = (Math.random() * N) | 0;
    }
    for (let k = 0; k < 3; k++) {
      src[e * 3 + k] = pos[a * 3 + k];
      dst[e * 3 + k] = pos[b * 3 + k];
    }
  }
  return { pos, color, size, src, dst };
}

// ---- 图层构造(binary attributes 直灌,radius 世界空间 + 像素钳制)----
function pointLayer(d, n) {
  return new deck.ScatterplotLayer({
    id: "pts", radiusUnits: "common", radiusMinPixels: 1.5, radiusMaxPixels: 6,
    billboard: true,
    data: { length: n, attributes: {
      getPosition: { value: d.pos, size: 3 },
      getFillColor: { value: d.color, size: 4 },
      getRadius: { value: d.size, size: 1 },
    } },
  });
}
function lineLayer(d, n) {
  return new deck.LineLayer({
    id: "edges", widthUnits: "pixels", getWidth: 1,
    getColor: [255, 255, 255, 18],
    data: { length: n, attributes: {
      getSourcePosition: { value: d.src, size: 3 },
      getTargetPosition: { value: d.dst, size: 3 },
    } },
  });
}

// ---- 基准循环:rAF 驱动旋转,统计帧时 ----
async function measure(dk, viewState, seconds, label, onTick) {
  const frames = [];
  let rot = viewState.rotationOrbit, last = performance.now();
  const t0 = last;
  return new Promise((resolve) => {
    function tick(now) {
      frames.push(now - last); last = now;
      rot += 0.25;
      dk.setProps({ viewState: { ...viewState, rotationOrbit: rot } });
      if (onTick) onTick(now - t0);
      log(`${label}\n已运行 ${((now - t0) / 1000).toFixed(1)}s / ${seconds}s`);
      if (now - t0 < seconds * 1000) requestAnimationFrame(tick);
      else {
        frames.shift();
        const avg = 1000 / (frames.reduce((a, b) => a + b, 0) / frames.length);
        const sorted = [...frames].sort((a, b) => b - a);
        const p95frame = sorted[Math.floor(frames.length * 0.05)];
        resolve({ label, avg_fps: +avg.toFixed(1),
                  p95_low_fps: +(1000 / p95frame).toFixed(1),
                  worst_frame_ms: +sorted[0].toFixed(1) });
      }
    }
    requestAnimationFrame(tick);
  });
}

(async () => {
  log("生成合成数据…");
  await new Promise(r => setTimeout(r, 30));
  const d = makeData();
  const viewState = { target: [0, 0, 0], zoom: 0.1, rotationX: 25,
                      rotationOrbit: 0, minZoom: -3, maxZoom: 8 };
  const dk = new deck.Deck({
    views: new deck.OrbitView(), controller: false, viewState,
    useDevicePixels: Math.min(devicePixelRatio, 1.5),
    parent: document.body, layers: [pointLayer(d, N)],
  });
  const results = { device: navigator.userAgent,
                    dpr: devicePixelRatio, n_points: N, n_edges: E, phases: [] };

  for (const ne of [0, 100_000, 200_000, 350_000]) {
    dk.setProps({ layers: ne ? [pointLayer(d, N), lineLayer(d, ne)]
                             : [pointLayer(d, N)] });
    results.phases.push(await measure(dk, viewState, 6,
      `DPR1.5 点 99 万 + 边 ${ne / 10000} 万`));
  }

  // 阶段 3:流式渐进——每 400ms 追加 1/8 数据,量测追加期的最差帧
  let chunk = 1;
  dk.setProps({ layers: [pointLayer(d, N >> 3)] });
  results.phases.push(await measure(dk, viewState, 6, "阶段 3:流式分块追加",
    (t) => {
      const want = Math.min(8, 1 + Math.floor(t / 400));
      if (want > chunk) {
        chunk = want;
        const n = chunk === 8 ? N : (N >> 3) * chunk;
        dk.setProps({ layers: [pointLayer(d, n), lineLayer(d, (E >> 3) * chunk)] });
      }
    }));

  log("完成,回传结果…");
  await fetch("/report", { method: "POST", body: JSON.stringify(results) });
  log("spike 完成:\n" + results.phases.map(p =>
    `${p.label}  avg ${p.avg_fps}fps  p95低 ${p.p95_low_fps}fps  最差帧 ${p.worst_frame_ms}ms`
  ).join("\n") + "\n结果已回传,可关闭本页。");
})();
</script>
</body>
</html>
